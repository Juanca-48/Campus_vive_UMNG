{% extends "auth/_layout.html" %}
{% block title %}Registro{% endblock %}

{% block form %}
<form method="post" class="cv-auth__card">
  <h1 class="h4 mb-3">Crea tu cuenta</h1>
  <div class="mb-3">
    <label class="form-label" for="nombre">Nombre completo</label>
    <input class="form-control cv-input-light" id="nombre" name="nombre" required autofocus
           value="{{ datos.nombre }}" autocomplete="name">
  </div>
  <div class="mb-3">
    <label class="form-label" for="correo">Correo institucional</label>
    <input class="form-control cv-input-light" id="correo" name="correo" type="email" required
           value="{{ datos.correo }}" placeholder="nombre.apellido@unimilitar.edu.co" autocomplete="email">
  </div>
  <div class="row g-3 mb-4">
    <div class="col-sm-6">
      <label class="form-label" for="clave">Contraseña</label>
      <input class="form-control cv-input-light" id="clave" name="clave" type="password" required
             minlength="{{ clave_min }}" autocomplete="new-password">
    </div>
    <div class="col-sm-6">
      <label class="form-label" for="clave2">Repite la contraseña</label>
      <input class="form-control cv-input-light" id="clave2" name="clave2" type="password" required
             minlength="{{ clave_min }}" autocomplete="new-password">
    </div>
    <div class="form-text mt-1">Mínimo {{ clave_min }} caracteres.</div>
  </div>
  <button class="btn cv-btn-primary w-100">Crear cuenta <i class="bi bi-arrow-right"></i></button>
  <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a class="cv-link" href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</form>
{% endblock %}
